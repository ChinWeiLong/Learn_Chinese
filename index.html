<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>马来小狮识字乐园 | 二年级华文学习</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #f9e7b3 0%, #f5d99b 100%);
            font-family: 'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI Emoji', cursive;
            min-height: 100vh;
            padding: 16px;
        }

        /* 主容器 */
        .app {
            max-width: 1200px;
            margin: 0 auto;
            background: #fffef5;
            border-radius: 60px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2), 0 0 0 10px #ffdd99, 0 0 0 14px #f7b05e;
            overflow: hidden;
        }

        /* 头部 */
        .header {
            background: #ffefd0;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            border-bottom: 4px solid #ffcf8a;
        }
        .logo h1 {
            font-size: 1.6rem;
            color: #e67e22;
        }
        .logo p {
            color: #b45f2b;
            font-size: 0.8rem;
        }
        .mode-box {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #ffd999;
            padding: 6px 18px;
            border-radius: 40px;
        }
        .mode-badge {
            background: #c96f2a;
            color: white;
            padding: 4px 16px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .teacher-btn {
            background: #ffaa55;
            border: none;
            padding: 6px 16px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 3px 0 #b46227;
            transition: 0.05s linear;
        }
        .teacher-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #b46227;
        }

        /* 菜单 */
        .menu {
            display: flex;
            background: #fff5e8;
            padding: 12px 20px;
            gap: 12px;
            flex-wrap: wrap;
            border-bottom: 2px solid #ffdbb5;
        }
        .menu-item {
            background: #ffe6c7;
            border: none;
            padding: 10px 28px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #b45a2c;
            cursor: pointer;
            font-family: inherit;
            transition: 0.2s;
        }
        .menu-item.active {
            background: #ffa559;
            color: white;
            box-shadow: 0 4px 0 #b46227;
        }

        /* 内容区 */
        .content {
            padding: 28px 32px;
            min-height: 500px;
        }
        .page {
            display: none;
        }
        .page.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px);}
            to { opacity: 1; transform: translateY(0);}
        }

        /* 卡片样式 */
        .card {
            background: #fffaf0;
            border-radius: 48px;
            padding: 24px;
            box-shadow: 0 8px 0 #ffcf9a;
            border: 2px solid #ffdaaa;
        }
        .card h2 {
            background: #ffb347;
            display: inline-block;
            padding: 6px 24px;
            border-radius: 40px;
            color: white;
            margin-bottom: 24px;
            font-size: 1.5rem;
        }

        /* 朗读区 */
        .read-box {
            text-align: center;
        }
        .big-char {
            font-size: 7rem;
            background: #ffefcf;
            padding: 30px;
            border-radius: 70px;
            margin: 20px 0;
            color: #c96f2a;
            font-family: '楷体', '华文楷书', KaiTi, cursive;
            border: 4px dashed #ffb56b;
            letter-spacing: 12px;
        }
        .speak-btn {
            background: #ffaa55;
            border: none;
            font-size: 1.4rem;
            padding: 12px 32px;
            border-radius: 60px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 0 #a45116;
            font-family: inherit;
        }
        .speak-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #a45116;
        }

        /* 笔顺区 */
        .stroke-selector {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .stroke-char {
            background: #ffe0b5;
            border: none;
            font-size: 1.6rem;
            padding: 8px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
        }
        .stroke-char.active {
            background: #ffa559;
            color: white;
        }
        .canvas-box {
            text-align: center;
            margin: 15px 0;
        }
        canvas {
            background: #fff5e8;
            border-radius: 32px;
            width: 100%;
            max-width: 300px;
            height: auto;
            aspect-ratio: 1;
            box-shadow: inset 0 0 0 3px #ffcc88, 0 5px 15px rgba(0,0,0,0.1);
            cursor: crosshair;
        }
        .stroke-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        .btn {
            background: #ffbc7a;
            border: none;
            padding: 8px 20px;
            border-radius: 36px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 3px 0 #b46227;
            font-family: inherit;
        }
        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #b46227;
        }

        /* 听音选字 */
        .listen-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 20px;
            margin: 25px 0;
        }
        .listen-card {
            background: #ffefdb;
            border-radius: 50px;
            padding: 20px;
            text-align: center;
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
            border: 3px solid #ffcf94;
            transition: 0.1s;
        }
        .listen-card:hover {
            background: #ffe2bd;
            transform: scale(0.96);
        }
        .feedback {
            background: #ffefcf;
            border-radius: 50px;
            padding: 12px;
            text-align: center;
            font-size: 1.2rem;
            margin-top: 15px;
        }

        /* 配对区 */
        .pair-area {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .pair-row {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
        }
        .pair-item {
            background: #fff0de;
            border-radius: 40px;
            padding: 16px;
            text-align: center;
            min-width: 110px;
            flex: 1;
            cursor: pointer;
            border: 3px solid #ffcd94;
            transition: 0.05s;
        }
        .pair-item.selected {
            background: #ffe3aa;
            border: 4px solid #ff9340;
        }
        .pair-item.matched {
            display: none;
        }
        .pair-char {
            font-size: 2rem;
        }
        .pair-pinyin {
            font-size: 1.1rem;
            color: #b45f2b;
        }

        /* 教师面板 */
        .teacher-panel {
            background: #fff0e0;
            border-radius: 48px;
            padding: 20px;
            margin-top: 25px;
            border: 2px solid #ffb76e;
        }
        .pwd-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .pwd-box input {
            padding: 8px 16px;
            border-radius: 40px;
            border: 1px solid #ffb462;
            font-family: inherit;
            flex: 1;
        }
        .edit-list {
            max-height: 200px;
            overflow-y: auto;
            background: #fff6ea;
            padding: 12px;
            border-radius: 32px;
            margin: 15px 0;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .edit-item {
            background: #ffe2bd;
            padding: 6px 12px;
            border-radius: 40px;
            display: inline-flex;
            gap: 8px;
            align-items: center;
        }
        .edit-item input {
            width: 70px;
            border-radius: 30px;
            border: 1px solid #ffb462;
            text-align: center;
            padding: 4px;
        }
        footer {
            text-align: center;
            padding: 16px;
            background: #ffefdb;
            font-size: 0.75rem;
            color: #b45f2b;
        }
        @media (max-width: 600px) {
            .content { padding: 16px; }
            .big-char { font-size: 4rem; }
            .listen-card { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <div class="logo">
            <h1>🐯 马来小狮识字乐园</h1>
            <p>二年级华文 · 马来西亚课本</p>
        </div>
        <div class="mode-box">
            <span class="mode-badge" id="modeLabel">👧 学生模式</span>
            <button id="teacherModeBtn" class="teacher-btn">🔐 教师入口</button>
        </div>
    </div>

    <div class="menu">
        <button class="menu-item active" data-page="read">🔊 朗读</button>
        <button class="menu-item" data-page="stroke">✍️ 笔顺</button>
        <button class="menu-item" data-page="listen">🎧 听音选字</button>
        <button class="menu-item" data-page="pair">🧩 配对游戏</button>
    </div>

    <div class="content">
        <!-- 朗读页面 -->
        <div id="page-read" class="page active">
            <div class="card">
                <h2>📣 大声朗读</h2>
                <div class="read-box">
                    <div class="big-char" id="readChar">朋</div>
                    <button class="speak-btn" id="readSpeakBtn">🔊 播放读音</button>
                    <p style="margin-top: 20px;">✨ 点击喇叭，跟着小老虎一起读 ✨</p>
                </div>
            </div>
        </div>

        <!-- 笔顺页面 -->
        <div id="page-stroke" class="page">
            <div class="card">
                <h2>✍️ 正确笔顺练习</h2>
                <div class="stroke-selector" id="strokeSelector"></div>
                <div class="canvas-box">
                    <canvas id="strokeCanvas" width="300" height="300"></canvas>
                </div>
                <div class="stroke-buttons">
                    <button class="btn" id="clearCanvas">🧽 清空画板</button>
                    <button class="btn" id="animateStroke">✨ 演示笔顺</button>
                </div>
                <p style="text-align: center; font-size: 0.75rem; margin-top: 12px;">💡 用手指按顺序描写，点击演示观看正确笔顺</p>
            </div>
        </div>

        <!-- 听音选字页面 -->
        <div id="page-listen" class="page">
            <div class="card">
                <h2>🎵 听声音找生字</h2>
                <div style="text-align: center;">
                    <button class="speak-btn" id="listenSpeakBtn">🔊 播放生字读音</button>
                    <div id="listenOptions" class="listen-options"></div>
                    <div id="listenFeedback" class="feedback">✨ 点击喇叭听读音，再点击正确的汉字 ✨</div>
                </div>
            </div>
        </div>

        <!-- 配对页面 -->
        <div id="page-pair" class="page">
            <div class="card">
                <h2>🧩 生字配对拼音</h2>
                <div id="pairContainer" class="pair-area"></div>
                <button class="btn" id="resetPair" style="margin-top: 20px; width: 100%;">🔄 重新配对</button>
                <div id="pairFeedback" class="feedback" style="margin-top: 15px;">⭐ 点击汉字，再点击对应的拼音</div>
            </div>
        </div>

        <!-- 教师面板 -->
        <div id="teacherPanel" style="display: none;" class="teacher-panel">
            <h3>👩‍🏫 教师模式 - 编辑生字库</h3>
            <div class="pwd-box">
                <input type="password" id="teacherPassword" placeholder="请输入教师密码">
                <button class="btn" id="unlockEdit">🔓 解锁编辑</button>
            </div>
            <div id="editArea" style="display: none;">
                <div id="editList" class="edit-list"></div>
                <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                    <button class="btn" id="addWord">➕ 添加生字</button>
                    <button class="btn save-btn" id="saveWords" style="background: #6fbf4c;">💾 保存修改</button>
                    <button class="btn" id="exitTeacher">🚪 退出教师模式</button>
                </div>
                <p style="margin-top: 12px; font-size: 0.75rem;">⚠️ 修改后所有页面会自动更新 | 教师密码: 123456</p>
            </div>
        </div>
    </div>
    <footer>🐣 小马来虎陪你快乐学华文 | 依据马来西亚二年级课本编写</footer>
</div>

<script>
    // ==================== 生字库 ====================
    let wordBank = [
        { char: "朋", pinyin: "péng" },
        { char: "友", pinyin: "yǒu" },
        { char: "校", pinyin: "xiào" },
        { char: "学", pinyin: "xué" },
        { char: "习", pinyin: "xí" },
        { char: "快", pinyin: "kuài" },
        { char: "乐", pinyin: "lè" },
        { char: "读", pinyin: "dú" },
        { char: "书", pinyin: "shū" }
    ];

    // ==================== 笔顺数据库 ====================
    const strokeData = {
        "朋": [
            (ctx) => { ctx.beginPath(); ctx.moveTo(80,70); ctx.lineTo(110,62); ctx.lineTo(118,125); ctx.lineTo(88,135); ctx.fill(); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(70,95); ctx.lineTo(80,190); ctx.lineTo(110,198); ctx.lineTo(100,105); ctx.fill(); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(172,65); ctx.lineTo(200,60); ctx.lineTo(208,120); ctx.lineTo(180,128); ctx.fill(); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(162,88); ctx.lineTo(172,182); ctx.lineTo(200,188); ctx.lineTo(190,98); ctx.fill(); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(132,148); ctx.lineTo(168,144); ctx.stroke(); }
        ],
        "友": [
            (ctx) => { ctx.beginPath(); ctx.moveTo(120,70); ctx.lineTo(100,130); ctx.lineTo(150,135); ctx.lineTo(170,80); ctx.fill(); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(80,100); ctx.lineTo(180,95); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(120,130); ctx.lineTo(100,200); ctx.lineTo(150,210); ctx.lineTo(160,160); ctx.fill(); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(170,160); ctx.lineTo(200,190); ctx.stroke(); }
        ],
        "校": [
            (ctx) => { ctx.beginPath(); ctx.moveTo(70,70); ctx.lineTo(70,200); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(45,120); ctx.lineTo(95,120); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(70,100); ctx.lineTo(55,70); ctx.stroke(); ctx.beginPath(); ctx.moveTo(70,100); ctx.lineTo(85,70); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(130,80); ctx.lineTo(160,75); ctx.lineTo(170,125); ctx.lineTo(140,130); ctx.fill(); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(150,125); ctx.lineTo(140,180); ctx.lineTo(190,185); ctx.lineTo(195,140); ctx.fill(); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(180,100); ctx.lineTo(210,105); ctx.stroke(); }
        ],
        "学": [
            (ctx) => { ctx.beginPath(); ctx.moveTo(100,60); ctx.lineTo(200,60); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(150,60); ctx.lineTo(150,100); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(80,100); ctx.lineTo(220,100); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(110,130); ctx.lineTo(190,130); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(150,130); ctx.lineTo(150,200); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(90,170); ctx.lineTo(210,170); ctx.stroke(); }
        ],
        "习": [
            (ctx) => { ctx.beginPath(); ctx.moveTo(100,70); ctx.lineTo(200,70); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(80,100); ctx.lineTo(220,100); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(70,130); ctx.lineTo(230,130); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.ellipse(150,160,40,25,0,0,Math.PI*2); ctx.stroke(); }
        ],
        "快": [
            (ctx) => { ctx.beginPath(); ctx.moveTo(60,80); ctx.lineTo(60,210); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(40,120); ctx.lineTo(80,120); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(110,90); ctx.lineTo(140,85); ctx.lineTo(150,130); ctx.lineTo(120,135); ctx.fill(); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(150,110); ctx.lineTo(190,100); ctx.lineTo(210,150); ctx.lineTo(170,160); ctx.fill(); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(190,130); ctx.lineTo(220,180); ctx.stroke(); }
        ],
        "乐": [
            (ctx) => { ctx.beginPath(); ctx.moveTo(150,50); ctx.lineTo(150,220); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(80,100); ctx.lineTo(220,100); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(80,150); ctx.lineTo(220,150); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(100,180); ctx.lineTo(200,180); ctx.stroke(); }
        ],
        "读": [
            (ctx) => { ctx.beginPath(); ctx.moveTo(70,70); ctx.lineTo(70,210); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(50,110); ctx.lineTo(90,110); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(120,80); ctx.lineTo(150,75); ctx.lineTo(160,120); ctx.lineTo(130,125); ctx.fill(); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(150,95); ctx.lineTo(190,90); ctx.lineTo(200,140); ctx.lineTo(170,145); ctx.fill(); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(180,115); ctx.lineTo(210,110); ctx.lineTo(220,160); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(95,160); ctx.lineTo(220,160); ctx.stroke(); }
        ],
        "书": [
            (ctx) => { ctx.beginPath(); ctx.moveTo(100,70); ctx.lineTo(200,70); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(80,110); ctx.lineTo(220,110); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(150,50); ctx.lineTo(150,180); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(110,150); ctx.lineTo(190,150); ctx.stroke(); }
        ]
    };

    function getStrokeFuncs(char) {
        return strokeData[char] || [ (ctx) => { ctx.beginPath(); ctx.moveTo(50,150); ctx.lineTo(250,150); ctx.stroke(); } ];
    }

    // ==================== 全局变量 ====================
    let currentStrokeChar = "朋";
    let strokeFunctions = [];
    let canvas, ctx;
    let strokeAnimInterval = null;
    let selectedPair = null;
    let currentListenWord = null;
    let isTeacherMode = false;

    // ==================== 朗读功能 ====================
    function speakWord(word) {
        const utterance = new SpeechSynthesisUtterance(word);
        utterance.lang = 'zh-CN';
        utterance.rate = 0.7;
        speechSynthesis.cancel();
        speechSynthesis.speak(utterance);
    }

    // ==================== 笔顺功能 ====================
    function initCanvas() {
        canvas = document.getElementById('strokeCanvas');
        if (!canvas) return;
        ctx = canvas.getContext('2d');
        clearCanvas();
    }

    function clearCanvas() {
        if (!ctx) return;
        ctx.clearRect(0, 0, 300, 300);
        ctx.fillStyle = "#fff5e8";
        ctx.fillRect(0, 0, 300, 300);
        ctx.strokeStyle = "#b45f2b";
        ctx.fillStyle = "#b45f2b";
        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
    }

    function loadStroke(char) {
        strokeFunctions = getStrokeFuncs(char);
        clearCanvas();
    }

    function drawFullStroke() {
        clearCanvas();
        for (let fn of strokeFunctions) {
            ctx.save();
            fn(ctx);
            ctx.restore();
        }
    }

    function animateStroke() {
        if (strokeAnimInterval) clearInterval(strokeAnimInterval);
        clearCanvas();
        let idx = 0;
        function drawNext() {
            if (idx < strokeFunctions.length) {
                strokeFunctions[idx](ctx);
                idx++;
            } else {
                clearInterval(strokeAnimInterval);
                strokeAnimInterval = null;
            }
        }
        strokeAnimInterval = setInterval(drawNext, 550);
    }

    function buildStrokeSelector() {
        const container = document.getElementById('strokeSelector');
        if (!container) return;
        container.innerHTML = '';
        wordBank.forEach(w => {
            const btn = document.createElement('button');
            btn.textContent = w.char;
            btn.className = 'stroke-char';
            if (w.char === currentStrokeChar) btn.classList.add('active');
            btn.onclick = () => {
                document.querySelectorAll('.stroke-char').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentStrokeChar = w.char;
                loadStroke(currentStrokeChar);
                document.getElementById('readChar').textContent = currentStrokeChar;
            };
            container.appendChild(btn);
        });
        if (wordBank.length > 0 && !wordBank.find(w => w.char === currentStrokeChar)) {
            currentStrokeChar = wordBank[0].char;
        }
        loadStroke(currentStrokeChar);
    }

    // ==================== 听音选字 ====================
    function buildListenGame() {
        if (wordBank.length === 0) return;
        const randomIndex = Math.floor(Math.random() * wordBank.length);
        currentListenWord = wordBank[randomIndex];
        
        let options = [currentListenWord];
        const others = wordBank.filter(w => w.char !== currentListenWord.char);
        for (let i = 0; i < Math.min(3, others.length); i++) {
            options.push(others[i]);
        }
        options = options.sort(() => Math.random() - 0.5);
        
        const container = document.getElementById('listenOptions');
        container.innerHTML = '';
        options.forEach(opt => {
            const div = document.createElement('div');
            div.className = 'listen-card';
            div.textContent = opt.char;
            div.onclick = () => {
                const feedback = document.getElementById('listenFeedback');
                if (opt.char === currentListenWord.char) {
                    feedback.innerHTML = '✅ 太棒了！答对了！ 🎉🎉🎉';
                    setTimeout(() => buildListenGame(), 1200);
                } else {
                    feedback.innerHTML = `❌ 不对哦～ 正确答案是 "${currentListenWord.char}"，再试一次！`;
                }
            };
            container.appendChild(div);
        });
        document.getElementById('listenFeedback').innerHTML = '🔊 点击喇叭听读音，再点击正确的汉字！';
    }

    // ==================== 配对游戏 ====================
    function buildPairGame() {
        const container = document.getElementById('pairContainer');
        if (!container) return;
        container.innerHTML = '';
        selectedPair = null;
        
        const shuffled = [...wordBank];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        
        const charRow = document.createElement('div');
        charRow.className = 'pair-row';
        const pinyinRow = document.createElement('div');
        pinyinRow.className = 'pair-row';
        
        shuffled.forEach(item => {
            const charBox = document.createElement('div');
            charBox.className = 'pair-item';
            charBox.dataset.type = 'char';
            charBox.dataset.value = item.char;
            charBox.dataset.match = item.pinyin;
            charBox.innerHTML = `<div class="pair-char">${item.char}</div><div class="pair-pinyin">📖 汉字</div>`;
            charRow.appendChild(charBox);
            
            const pinyinBox = document.createElement('div');
            pinyinBox.className = 'pair-item';
            pinyinBox.dataset.type = 'pinyin';
            pinyinBox.dataset.value = item.pinyin;
            pinyinBox.dataset.match = item.char;
            pinyinBox.innerHTML = `<div class="pair-char">${item.pinyin}</div><div class="pair-pinyin">🔊 拼音</div>`;
            pinyinRow.appendChild(pinyinBox);
        });
        
        container.appendChild(charRow);
        container.appendChild(pinyinRow);
        
        attachPairEvents();
    }
    
    function attachPairEvents() {
        document.querySelectorAll('.pair-item').forEach(item => {
            item.onclick = () => handlePairClick(item);
        });
    }
    
    function handlePairClick(item) {
        if (item.classList.contains('matched')) return;
        
        if (selectedPair === null) {
            if (document.querySelector('.pair-item.selected')) {
                document.querySelector('.pair-item.selected').classList.remove('selected');
            }
            selectedPair = item;
            item.classList.add('selected');
        } else {
            const first = selectedPair;
            const second = item;
            let isMatch = false;
            
            if (first.dataset.type === 'char' && second.dataset.type === 'pinyin') {
                if (first.dataset.match === second.dataset.value) isMatch = true;
            } else if (first.dataset.type === 'pinyin' && second.dataset.type === 'char') {
                if (first.dataset.match === second.dataset.value) isMatch = true;
            }
            
            if (isMatch) {
                first.classList.add('matched');
                second.classList.add('matched');
                document.getElementById('pairFeedback').innerHTML = '🎉 配对成功！好聪明！ 🎉';
            } else {
                document.getElementById('pairFeedback').innerHTML = '😢 配对错误，再试试看！汉字要配对应的拼音哦～';
            }
            first.classList.remove('selected');
            selectedPair = null;
        }
    }

    // ==================== 教师模式 ====================
    function refreshEditList() {
        const container = document.getElementById('editList');
        container.innerHTML = '';
        wordBank.forEach((item, idx) => {
            const div = document.createElement('div');
            div.className = 'edit-item';
            div.innerHTML = `
                <input type="text" class="edit-char" value="${item.char}" style="width:70px">
                <input type="text" class="edit-pinyin" value="${item.pinyin}" style="width:80px">
                <button class="btn" data-idx="${idx}" style="background:#ff8c5a; padding:4px 12px;">🗑️</button>
            `;
            container.appendChild(div);
        });
        
        document.querySelectorAll('.edit-item .btn').forEach(btn => {
            btn.onclick = (e) => {
                const idx = parseInt(btn.dataset.idx);
                if (!isNaN(idx)) {
                    wordBank.splice(idx, 1);
                    refreshEditList();
                }
            };
        });
    }
    
    function saveWordBank() {
        const newBank = [];
        document.querySelectorAll('.edit-item').forEach(item => {
            const charInput = item.querySelector('.edit-char');
            const pinyinInput = item.querySelector('.edit-pinyin');
            if (charInput && pinyinInput && charInput.value.trim()) {
                newBank.push({ char: charInput.value.trim(), pinyin: pinyinInput.value.trim() });
            }
        });
        if (newBank.length > 0) wordBank = newBank;
        
        // 刷新所有页面
        buildStrokeSelector();
        buildListenGame();
        buildPairGame();
        document.getElementById('readChar').textContent = currentStrokeChar;
        document.getElementById('pairFeedback').innerHTML = '✅ 字库已更新！';
    }

        document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));

        document.querySelectorAll('.menu-item').forEach(btn => btn.classList.remove('active'));
        document.querySelector(`.menu-item[data-page="${pageId}"]`).classList.add('active');
        
        if (pageId === 'listen') buildListenGame();
        if (pageId === 'pair') buildPairGame();
        if (pageId === 'stroke') { initCanvas(); loadStroke(currentStrokeChar); }
    }
