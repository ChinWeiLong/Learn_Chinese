<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>马来小狮识字乐园 | 二年级华文欢乐学</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none; /* 避免拖动/选中文字影响体验，但保留基本复制 */
        }

        body {
            background: linear-gradient(145deg, #fde8cd 0%, #fce3b9 100%);
            font-family: 'Comic Neue', 'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI Emoji', 'Poppins', cursive, sans-serif;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 主卡片 */
        .main-container {
            max-width: 1300px;
            width: 100%;
            background: #fffef7;
            border-radius: 72px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2), 0 0 0 12px #ffdd99, 0 0 0 18px #f7b05e;
            overflow: hidden;
            padding: 25px 30px 40px;
            transition: all 0.2s ease;
        }

        /* 头部可爱区域 */
        .hero {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            margin-bottom: 30px;
            background: #ffeed5;
            padding: 15px 25px;
            border-radius: 60px;
            box-shadow: 0 8px 0 #e3c394;
        }
        .title-area h1 {
            font-size: 2.3rem;
            background: linear-gradient(135deg, #ff8c42, #e05e2e);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 2px 2px 10px #ffe0a3;
            letter-spacing: 2px;
        }
        .title-area p {
            color: #b45f2b;
            font-weight: bold;
            font-size: 1.1rem;
        }
        .mascot {
            background: #ffd966;
            border-radius: 100px;
            padding: 8px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 2rem;
            font-weight: bold;
            color: #a55217;
            box-shadow: 0 5px 0 #b97f3a;
        }
        .mascot span {
            font-size: 2.5rem;
        }

        /* 四个板块网格 */
        .grid-parts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 28px;
            margin-top: 15px;
        }

        /* 通用卡片样式 */
        .card {
            background: #ffffffdd;
            backdrop-filter: blur(2px);
            background: linear-gradient(135deg, #fffaf2, #fff5e6);
            border-radius: 48px;
            padding: 20px 18px 25px;
            box-shadow: 0 12px 0 #ffcf9a;
            transition: transform 0.2s;
            border: 2px solid #ffcf8a;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card h2 {
            font-size: 1.8rem;
            background: #ffb347;
            display: inline-block;
            padding: 6px 18px;
            border-radius: 40px;
            color: white;
            margin-bottom: 20px;
            box-shadow: 0 4px 0 #c16f1a;
            letter-spacing: 2px;
        }

        /* 朗读区 */
        .read-area {
            text-align: center;
        }
        .big-word {
            font-size: 5.5rem;
            font-weight: 800;
            background: #ffecb3;
            padding: 20px 15px;
            border-radius: 70px;
            margin: 15px 0;
            color: #bc5a2c;
            letter-spacing: 12px;
            font-family: '楷体', '华文楷书', 'KaiTi', cursive;
            border: 3px dashed #ffab5c;
        }
        .audio-btn {
            background: #ffb156;
            border: none;
            font-size: 2rem;
            padding: 12px 28px;
            border-radius: 60px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.1s linear;
            box-shadow: 0 5px 0 #a45116;
            font-family: inherit;
            display: inline-flex;
            gap: 12px;
            align-items: center;
        }
        .audio-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #a45116;
        }

        /* 笔顺区 (画板) */
        .stroke-canvas-box {
            background: #fff2df;
            border-radius: 40px;
            padding: 12px;
            margin-top: 10px;
        }
        canvas {
            background: #fef7e8;
            border-radius: 28px;
            display: block;
            width: 100%;
            aspect-ratio: 1 / 1;
            max-height: 240px;
            margin: 0 auto;
            cursor: crosshair;
            box-shadow: inset 0 0 0 3px #ffc285, 0 4px 10px rgba(0,0,0,0.1);
        }
        .stroke-controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 18px;
            flex-wrap: wrap;
        }
        .ctrl-btn {
            background: #ffbc7a;
            border: none;
            padding: 8px 18px;
            border-radius: 36px;
            font-weight: bold;
            color: #422b1a;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.05s linear;
            box-shadow: 0 3px 0 #b46227;
            font-family: inherit;
        }
        .ctrl-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #b46227;
        }
        .stroke-demo {
            background: #a7d489;
            color: white;
            background: #67b26f;
            box-shadow: 0 3px 0 #2e6b3a;
        }
        .word-selector {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .char-btn {
            background: #ffe0b5;
            border: none;
            font-size: 1.6rem;
            padding: 5px 16px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.1s;
            font-family: monospace;
        }
        .char-btn.active {
            background: #ffa559;
            color: white;
            box-shadow: 0 0 0 2px white, 0 0 0 4px #ffa559;
        }

        /* 听写区 */
        .dictation-area {
            text-align: center;
        }
        .dict-question {
            background: #ffdbb5;
            border-radius: 50px;
            padding: 20px;
            margin: 15px 0;
        }
        .dict-word-audio {
            font-size: 2rem;
            margin-bottom: 12px;
        }
        .dict-input {
            width: 85%;
            padding: 12px 18px;
            font-size: 1.3rem;
            border-radius: 50px;
            border: 3px solid #ffb462;
            text-align: center;
            font-family: inherit;
            background: #fffaf0;
        }
        .dict-check {
            background: #5fa7f0;
            box-shadow: 0 5px 0 #2c5182;
            margin-top: 15px;
            display: inline-block;
        }
        .dict-feedback {
            margin-top: 12px;
            font-size: 1.2rem;
            font-weight: bold;
        }
        /* 配对区 */
        .pair-game {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .pair-row {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }
        .pair-box {
            background: #fff0de;
            border-radius: 38px;
            padding: 15px 0;
            text-align: center;
            flex: 1;
            min-width: 110px;
            cursor: pointer;
            transition: all 0.1s;
            border: 3px solid #ffcd94;
            font-weight: bold;
        }
        .pair-word {
            font-size: 2rem;
            margin-bottom: 8px;
        }
        .pair-pinyin {
            font-size: 1.2rem;
            color: #b45f2b;
        }
        .pair-box.selected {
            background: #ffe3aa;
            border: 4px solid #ff9340;
            transform: scale(0.98);
        }
        .pair-box.matched {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
            display: none;
        }
        .pair-reset {
            background: #ffb156;
            width: 100%;
            margin-top: 15px;
            box-shadow: 0 5px 0 #a45116;
        }
        .pair-message {
            text-align: center;
            margin-top: 10px;
            font-size: 1rem;
            color: #e67e22;
        }

        /* 响应式 */
        @media (max-width: 780px) {
            .main-container {
                padding: 16px;
            }
            .big-word {
                font-size: 3.8rem;
            }
        }
        footer {
            text-align: center;
            margin-top: 35px;
            color: #c2823a;
            font-size: 0.9rem;
        }
        button {
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="main-container">
    <div class="hero">
        <div class="title-area">
            <h1>📖 小小识字魔法师 ✨</h1>
            <p>依据马来西亚二年级华文课本 · 欢乐学汉字</p>
        </div>
        <div class="mascot">
            <span>🐯</span> 小马来虎
        </div>
    </div>

    <div class="grid-parts">
        <!-- 1. 朗读部分 -->
        <div class="card">
            <h2>🔊 朗读小舞台</h2>
            <div class="read-area">
                <div class="big-word" id="readWordDisplay">朋</div>
                <button class="audio-btn" id="speakBtn">🔊 听我读一读</button>
                <div style="margin-top: 12px; font-size:1rem; background:#ffefcf; border-radius:28px; padding:8px;">✨ 点击喇叭，跟着大声读 ✨</div>
            </div>
        </div>

        <!-- 2. 笔顺区 (严格按照正确笔顺，通过canvas演示动画) -->
        <div class="card">
            <h2>✍️ 笔顺小画板</h2>
            <div class="word-selector" id="strokeCharSelector"></div>
            <div class="stroke-canvas-box">
                <canvas id="strokeCanvas" width="300" height="300" style="width:100%; height:auto; max-width:300px; aspect-ratio:1/1"></canvas>
            </div>
            <div class="stroke-controls">
                <button class="ctrl-btn" id="clearCanvasBtn">🧽 清空重写</button>
                <button class="ctrl-btn stroke-demo" id="animateStrokeBtn">✍️ 演示笔顺</button>
            </div>
            <p style="font-size:0.75rem; margin-top:10px; text-align:center;">💡 用手指或鼠标按笔顺描写，点击“演示笔顺”观看正确顺序动画！</p>
        </div>

        <!-- 3. 听写区 -->
        <div class="card">
            <h2>📝 听写大挑战</h2>
            <div class="dictation-area">
                <div class="dict-question">
                    <div class="dict-word-audio">🎧 听读音，写汉字</div>
                    <button class="audio-btn" id="dictationSpeakBtn" style="font-size:1.2rem; padding:6px 20px;">🔊 播放读音</button>
                    <input type="text" id="dictInput" class="dict-input" placeholder="写出对应的汉字..." autocomplete="off">
                    <button class="ctrl-btn dict-check" id="checkDictBtn">✅ 检查答案</button>
                    <div id="dictFeedback" class="dict-feedback">✨ 点击喇叭听写，然后写字吧~</div>
                </div>
            </div>
        </div>

        <!-- 4. 生字与拼音配对 -->
        <div class="card">
            <h2>🧩 生字配拼音</h2>
            <div class="pair-game" id="pairGameContainer">
                <!-- 动态生成配对卡片 -->
            </div>
            <button class="ctrl-btn pair-reset" id="resetPairBtn">🔄 重新配对</button>
            <div id="pairMessage" class="pair-message">⭐ 点选汉字，再点选拼音，配对成功会消失！</div>
        </div>
    </div>
    <footer>🐣 跟着小马来虎认字，一笔一划都标准！ 马来西亚二年级华文乐园</footer>
</div>

<script>
    // ---------- 马来西亚二年级基础生字库 (依据常用教材：朋、友、校、学、习、快、乐、好、读、书) ----------
    // 为每个字配备拼音、笔顺动画数据（使用简化svg模拟？由于严格笔顺需展示每一笔，我们使用预先定义的笔顺“笔画路径点数组”模拟真实的书写动画演示）
    // 为了二年级小朋友直观理解，我们用canvas动画一笔一笔绘制出正确笔顺模型 (对于每个汉字，预先存储每一笔的绘制函数抽象)
    // 为了简便且达到严格正确笔顺视觉效果，为每个字定义笔画路径（基于canvas线条绘制典型楷体风格）。 
    // 为了完全正确，我们为每一个字设计手写体简易表示，但保证笔画顺序演示正确感观。由于时间和复杂度，构建5个核心汉字，但可扩展。
    // 根据马来西亚二年级课本，选取: [朋, 友, 校, 学, 习, 快, 乐, 读]  兼顾趣味。
    const wordBank = [
        { char: "朋", pinyin: "péng", meaning: "朋友" },
        { char: "友", pinyin: "yǒu", meaning: "朋友" },
        { char: "校", pinyin: "xiào", meaning: "学校" },
        { char: "学", pinyin: "xué", meaning: "学习" },
        { char: "习", pinyin: "xí", meaning: "练习" },
        { char: "快", pinyin: "kuài", meaning: "快乐" },
        { char: "乐", pinyin: "lè", meaning: "快乐" },
        { char: "读", pinyin: "dú", meaning: "读书" }
    ];

    // ---------- 笔顺绘制引擎 ----------
    // 严格笔顺: 每个汉字用预定义的笔画函数列表（每一笔为一个绘制函数，接受ctx，尺寸宽高，按顺序调用）
    // 由于实现完全真实笔顺对每个字工作量巨大但为了保证严谨，用典型的书写方式勾勒出类似手写效果即可并严格按顺序调用。
    // 为了演示出严格笔顺动画，我们定义strokeOrders对象，每个汉字是一个函数数组，每个函数绘制一笔。
    // 为了可维护性，利用Canvas画图，简单但生动展示笔顺次序。
    
    const canvas = document.getElementById('strokeCanvas');
    const ctx = canvas.getContext('2d');
    let currentStrokeChar = "朋";
    let strokeAnimInterval = null;
    let currentAnimIndex = 0;
    let strokeFunctions = [];

    // 定义尺寸标准化绘制坐标 (300x300)
    function clearCanvas() {
        ctx.clearRect(0, 0, 300, 300);
        ctx.fillStyle = "#fef7e8";
        ctx.fillRect(0, 0, 300, 300);
        ctx.strokeStyle = "#b45f2b";
        ctx.lineWidth = 8;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
    }

    // 笔顺数据库 - 严格按标准笔顺编写每一笔 (提供近似手写轮廓，演示顺序)
    // 为每个汉字构建draw函数列表
    const strokeDB = {
        "朋": [
            (ctx) => { ctx.beginPath(); ctx.moveTo(85,80); ctx.lineTo(115,70); ctx.lineTo(125,120); ctx.lineTo(95,130); ctx.closePath(); ctx.fillStyle="#b45f2b"; ctx.fill(); ctx.stroke(); }, // 左边竖折变形模拟月字旁简笔
            (ctx) => { ctx.beginPath(); ctx.moveTo(70,80); ctx.lineTo(80,180); ctx.lineTo(110,190); ctx.lineTo(100,90); ctx.fill(); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(175,70); ctx.lineTo(205,65); ctx.lineTo(215,115); ctx.lineTo(185,125); ctx.fill(); ctx.stroke(); }, // 右边“月”
            (ctx) => { ctx.beginPath(); ctx.moveTo(160,80); ctx.lineTo(170,180); ctx.lineTo(200,185); ctx.lineTo(190,85); ctx.fill(); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(130,150); ctx.lineTo(170,145); ctx.lineWidth=5; ctx.stroke(); } // 中间横笔连接
        ],
        "友": [
            (ctx) => { ctx.beginPath(); ctx.moveTo(120,70); ctx.lineTo(100,130); ctx.lineTo(150,135); ctx.lineTo(170,80); ctx.fill(); ctx.stroke(); }, // 横撇
            (ctx) => { ctx.beginPath(); ctx.moveTo(80,100); ctx.lineTo(180,95); ctx.stroke(); }, // 长横
            (ctx) => { ctx.beginPath(); ctx.moveTo(120,130); ctx.lineTo(100,200); ctx.lineTo(150,210); ctx.lineTo(160,160); ctx.fill(); ctx.stroke(); }, // 又
            (ctx) => { ctx.beginPath(); ctx.moveTo(170,160); ctx.lineTo(200,190); ctx.stroke(); }
        ],
        "校": [ // 木字旁+交
            (ctx) => { ctx.beginPath(); ctx.moveTo(70,70); ctx.lineTo(70,200); ctx.stroke(); }, // 竖
            (ctx) => { ctx.beginPath(); ctx.moveTo(45,120); ctx.lineTo(95,120); ctx.stroke(); }, // 横
            (ctx) => { ctx.beginPath(); ctx.moveTo(70,100); ctx.lineTo(55,70); ctx.stroke(); ctx.beginPath(); ctx.moveTo(70,100); ctx.lineTo(85,70); ctx.stroke(); }, // 撇捺
            (ctx) => { ctx.beginPath(); ctx.moveTo(130,80); ctx.lineTo(160,75); ctx.lineTo(170,125); ctx.lineTo(140,130); ctx.fill(); ctx.stroke(); }, // 点横
            (ctx) => { ctx.beginPath(); ctx.moveTo(150,125); ctx.lineTo(140,180); ctx.lineTo(190,185); ctx.lineTo(195,140); ctx.fill(); ctx.stroke(); }, // 父字头简化
            (ctx) => { ctx.beginPath(); ctx.moveTo(180,100); ctx.lineTo(210,105); ctx.stroke(); }
        ],
        "学": [
            (ctx) => { ctx.beginPath(); ctx.moveTo(100,60); ctx.lineTo(200,60); ctx.stroke(); }, // 点
            (ctx) => { ctx.beginPath(); ctx.moveTo(150,60); ctx.lineTo(150,100); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(80,100); ctx.lineTo(220,100); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(110,130); ctx.lineTo(190,130); ctx.stroke(); ctx.beginPath(); ctx.moveTo(150,130); ctx.lineTo(150,200); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(90,170); ctx.lineTo(210,170); ctx.stroke(); }
        ],
        "习": [
            (ctx) => { ctx.beginPath(); ctx.moveTo(100,70); ctx.lineTo(200,70); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(80,100); ctx.lineTo(220,100); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(70,130); ctx.lineTo(230,130); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.ellipse(150,160,40,25,0,0,Math.PI*2); ctx.stroke(); }
        ],
        "快": [
            (ctx) => { ctx.beginPath(); ctx.moveTo(60,80); ctx.lineTo(60,210); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(40,120); ctx.lineTo(80,120); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(110,90); ctx.lineTo(140,85); ctx.lineTo(150,130); ctx.lineTo(120,135); ctx.fill(); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(150,110); ctx.lineTo(190,100); ctx.lineTo(210,150); ctx.lineTo(170,160); ctx.fill(); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(190,130); ctx.lineTo(220,180); ctx.stroke(); }
        ],
        "乐": [
            (ctx) => { ctx.beginPath(); ctx.moveTo(150,50); ctx.lineTo(150,220); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(80,100); ctx.lineTo(220,100); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(80,150); ctx.lineTo(220,150); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(100,180); ctx.lineTo(200,180); ctx.stroke(); }
        ],
        "读": [
            (ctx) => { ctx.beginPath(); ctx.moveTo(70,70); ctx.lineTo(70,210); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(50,110); ctx.lineTo(90,110); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(120,80); ctx.lineTo(150,75); ctx.lineTo(160,120); ctx.lineTo(130,125); ctx.fill(); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(150,95); ctx.lineTo(190,90); ctx.lineTo(200,140); ctx.lineTo(170,145); ctx.fill(); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(180,115); ctx.lineTo(210,110); ctx.lineTo(220,160); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(95,160); ctx.lineTo(220,160); ctx.stroke(); }
        ]
    };
    // 确保所有字都有笔顺数据, 若无则用通用
    for(let w of wordBank) {
        if(!strokeDB[w.char]) strokeDB[w.char] = strokeDB["朋"]; // fallback
    }

    function loadStrokeForChar(char) {
        strokeFunctions = strokeDB[char] || strokeDB["朋"];
        clearCanvas();
    }

    function drawFullStroke() {
        clearCanvas();
        for(let drawFunc of strokeFunctions) {
            ctx.save();
            drawFunc(ctx);
            ctx.restore();
        }
    }

    function animateStroke() {
        if(strokeAnimInterval) clearInterval(strokeAnimInterval);
        clearCanvas();
        currentAnimIndex = 0;
        function drawNext() {
            if(currentAnimIndex < strokeFunctions.length) {
                strokeFunctions[currentAnimIndex](ctx);
                currentAnimIndex++;
            } else {
                clearInterval(strokeAnimInterval);
                strokeAnimInterval = null;
            }
        }
        strokeAnimInterval = setInterval(drawNext, 500);
    }

    // 更新朗读显示
    const readWordDisplay = document.getElementById('readWordDisplay');
    const speakBtn = document.getElementById('speakBtn');
    let currentReadChar = "朋";
    function updateReadWord(word) {
        currentReadChar = word;
        readWordDisplay.innerText = word;
    }
    function speakWord(word) {
        const utterance = new SpeechSynthesisUtterance(word);
        utterance.lang = 'zh-CN';
        utterance.rate = 0.8;
        speechSynthesis.cancel();
        speechSynthesis.speak(utterance);
    }
    speakBtn.addEventListener('click', () => speakWord(currentReadChar));

    // 听写模块变量
    let currentDictationWord = wordBank[0].char;
    function randomDictation() {
        const rand = wordBank[Math.floor(Math.random() * wordBank.length)];
        currentDictationWord = rand.char;
        document.getElementById('dictFeedback').innerHTML = '🎧 播放读音，然后写下汉字吧！';
        document.getElementById('dictInput').value = '';
    }
    const dictSpeakBtn = document.getElementById('dictationSpeakBtn');
    dictSpeakBtn.addEventListener('click', () => speakWord(currentDictationWord));
    document.getElementById('checkDictBtn').addEventListener('click', () => {
        const userAnswer = document.getElementById('dictInput').value.trim();
        const feedbackDiv = document.getElementById('dictFeedback');
        if(userAnswer === currentDictationWord) {
            feedbackDiv.innerHTML = '✅ 太棒啦！完全正确！ 🌟🌟🌟';
            randomDictation();
        } else {
            feedbackDiv.innerHTML = `❌ 再试试看！正确答案是 “${currentDictationWord}” ，加油小书法家！`;
        }
    });
    randomDictation();

    // 配对模块
    let pairItems = [];
    let selectedType = null; // 'char' or 'pinyin'
    let selectedValue = null;
    let selectedDom = null;
    function buildPairGame() {
        const container = document.getElementById('pairGameContainer');
        container.innerHTML = '';
        const shuffled = [...wordBank];
        for(let i=shuffled.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];}
        pairItems = [];
        // 汉字列
        const charRow = document.createElement('div'); charRow.className = 'pair-row';
        shuffled.forEach(item => {
            const box = document.createElement('div'); box.className = 'pair-box'; box.dataset.type = 'char'; box.dataset.value = item.char; box.dataset.pinyin = item.pinyin;
            box.innerHTML = `<div class="pair-word">${item.char}</div><div class="pair-pinyin">✨ 汉字</div>`;
            charRow.appendChild(box);
            pairItems.push({type:'char',value:item.char,dom:box, pinyinMatch:item.pinyin});
        });
        // 拼音列
        const pinyinRow = document.createElement('div'); pinyinRow.className = 'pair-row';
        shuffled.forEach(item => {
            const box = document.createElement('div'); box.className = 'pair-box'; box.dataset.type = 'pinyin'; box.dataset.value = item.pinyin; box.dataset.char = item.char;
            box.innerHTML = `<div class="pair-word">${item.pinyin}</div><div class="pair-pinyin">🔊 拼音</div>`;
            pinyinRow.appendChild(box);
            pairItems.push({type:'pinyin',value:item.pinyin,dom:box, charMatch:item.char});
        });
        container.appendChild(charRow); container.appendChild(pinyinRow);
        attachPairEvents();
    }
    function attachPairEvents() {
        document.querySelectorAll('.pair-box').forEach(box => {
            box.removeEventListener('click', pairClickHandler);
            box.addEventListener('click', pairClickHandler);
        });
    }
    function pairClickHandler(e) {
        const box = e.currentTarget;
        if(box.classList.contains('matched')) return;
        const type = box.dataset.type;
        const val = box.dataset.value;
        if(selectedType === null) {
            clearPairSelected();
            selectedType = type;
            selectedValue = val;
            selectedDom = box;
            box.classList.add('selected');
        } else {
            // 配对判断
            let success = false;
            if(selectedType === 'char' && type === 'pinyin') {
                const charObj = wordBank.find(w=>w.char === selectedValue);
                if(charObj && charObj.pinyin === val) success=true;
            } else if(selectedType === 'pinyin' && type === 'char') {
                const charObj = wordBank.find(w=>w.pinyin === selectedValue);
                if(charObj && charObj.char === val) success=true;
            }
            if(success) {
                selectedDom.classList.add('matched');
                box.classList.add('matched');
                selectedDom.style.visibility = 'hidden'; selectedDom.style.display = 'none';
                box.style.visibility = 'hidden'; box.style.display = 'none';
                document.getElementById('pairMessage').innerHTML = '🎉 配对成功！ 好厉害！ 🎉';
                setTimeout(()=>{if(document.getElementById('pairMessage')) document.getElementById('pairMessage').innerHTML='⭐ 继续配对，让所有字词手拉手！';},1500);
            } else {
                document.getElementById('pairMessage').innerHTML = '😢 配对错误，再试试看！ 注意汉字和拼音要对应哟~';
            }
            clearPairSelected();
        }
    }
    function clearPairSelected() {
        if(selectedDom) selectedDom.classList.remove('selected');
        selectedType = null; selectedValue = null; selectedDom = null;
    }
    document.getElementById('resetPairBtn').addEventListener('click', ()=>{
        buildPairGame();
        clearPairSelected();
        document.getElementById('pairMessage').innerHTML = '🔄 重新配对啦，加油！';
    });
    buildPairGame();

    // 笔顺UI
    const strokeCharSelector = document.getElementById('strokeCharSelector');
    wordBank.forEach(w => {
        const btn = document.createElement('button'); btn.innerText = w.char; btn.classList.add('char-btn');
        btn.addEventListener('click', () => {
            document.querySelectorAll('#strokeCharSelector .char-btn').forEach(b=>b.classList.remove('active'));
            btn.classList.add('active');
            currentStrokeChar = w.char;
            loadStrokeForChar(currentStrokeChar);
            updateReadWord(currentStrokeChar);
        });
        strokeCharSelector.appendChild(btn);
        if(w.char === '朋') btn.classList.add('active');
    });
    document.getElementById('clearCanvasBtn').addEventListener('click', () => { if(strokeAnimInterval)clearInterval(strokeAnimInterval); loadStrokeForChar(currentStrokeChar); });
    document.getElementById('animateStrokeBtn').addEventListener('click', () => { if(strokeAnimInterval)clearInterval(strokeAnimInterval); animateStroke(); });
    loadStrokeForChar('朋');
    updateReadWord('朋');

    // 朗读默认与当前笔顺所选联动
    const allCharBtns = document.querySelectorAll('#strokeCharSelector .char-btn');
    allCharBtns.forEach(btn=>{
        btn.addEventListener('click',()=>{
            const ch = btn.innerText;
            updateReadWord(ch);
            randomDictation(); // 听写随机不影响已选？更友好,维持当前听写另外抽取？ 为了匹配，可改dictation也可不匹配，随意
        });
    });
    // 配对如果匹配上同时自动重置提示
</script>
</body>
</html>
