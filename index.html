<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>马来小狮识字乐园 | 双模式·欢乐学华文</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none; /* 避免拖动影响体验，教师编辑时保留文本选择 */
        }

        body {
            background: linear-gradient(145deg, #fde8cd 0%, #fce3b9 100%);
            font-family: 'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI Emoji', 'Poppins', cursive, sans-serif;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 主容器 */
        .app-wrapper {
            max-width: 1300px;
            width: 100%;
            background: #fffef7;
            border-radius: 72px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2), 0 0 0 12px #ffdd99, 0 0 0 18px #f7b05e;
            overflow: hidden;
            transition: all 0.2s ease;
        }

        /* 头部区域 */
        .header {
            background: #ffeed5;
            padding: 15px 25px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            border-bottom: 5px solid #ffcf8a;
        }
        .title-area h1 {
            font-size: 1.8rem;
            background: linear-gradient(135deg, #ff8c42, #e05e2e);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .title-area p {
            color: #b45f2b;
            font-size: 0.85rem;
        }
        .mode-badge {
            background: #ffd966;
            border-radius: 60px;
            padding: 6px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: bold;
        }
        .mode-text {
            background: #a55217;
            color: white;
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 0.9rem;
        }
        .teacher-btn {
            background: #ffb156;
            border: none;
            padding: 6px 16px;
            border-radius: 32px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 3px 0 #9b521e;
            transition: 0.05s linear;
        }
        .teacher-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #9b521e;
        }

        /* 菜单导航栏 */
        .menu-nav {
            display: flex;
            background: #fff2e2;
            padding: 10px 20px;
            gap: 12px;
            flex-wrap: wrap;
            border-bottom: 2px solid #ffdaa5;
        }
        .menu-btn {
            background: #ffe2bd;
            border: none;
            padding: 10px 28px;
            border-radius: 40px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #b45a2c;
            cursor: pointer;
            transition: 0.1s;
            font-family: inherit;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .menu-btn.active {
            background: #ffa559;
            color: white;
            box-shadow: 0 4px 0 #b46227;
            transform: translateY(-2px);
        }

        /* 页面容器 */
        .page-container {
            padding: 25px 30px 35px;
            min-height: 550px;
        }
        .page {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .page.active-page {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px);}
            to { opacity: 1; transform: translateY(0);}
        }

        /* 通用卡片样式 */
        .card {
            background: #fffaf2;
            border-radius: 48px;
            padding: 20px 22px;
            box-shadow: 0 12px 0 #ffcf9a;
            border: 2px solid #ffcf8a;
            margin-bottom: 20px;
        }
        .card h2 {
            font-size: 1.7rem;
            background: #ffb347;
            display: inline-block;
            padding: 5px 20px;
            border-radius: 40px;
            color: white;
            margin-bottom: 20px;
            box-shadow: 0 4px 0 #c16f1a;
        }

        /* 朗读 */
        .read-area {
            text-align: center;
        }
        .big-word {
            font-size: 6rem;
            font-weight: 800;
            background: #ffecb3;
            padding: 20px;
            border-radius: 70px;
            margin: 20px 0;
            color: #bc5a2c;
            font-family: '楷体', '华文楷书', 'KaiTi', cursive;
            border: 3px dashed #ffab5c;
        }
        .audio-btn {
            background: #ffb156;
            border: none;
            font-size: 1.5rem;
            padding: 12px 28px;
            border-radius: 60px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 0 #a45116;
            font-family: inherit;
            display: inline-flex;
            gap: 12px;
            align-items: center;
        }
        .audio-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #a45116;
        }

        /* 笔顺区域 - 全新严格顺序 使用标准笔画序列绘制+演示 */
        .stroke-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .stroke-canvas-box {
            background: #fff2df;
            border-radius: 48px;
            padding: 15px;
            text-align: center;
        }
        canvas {
            background: #fef7e8;
            border-radius: 32px;
            width: 100%;
            max-width: 320px;
            height: auto;
            aspect-ratio: 1 / 1;
            cursor: crosshair;
            box-shadow: inset 0 0 0 3px #ffc285, 0 8px 15px rgba(0,0,0,0.1);
        }
        .stroke-controls {
            display: flex;
            justify-content: center;
            gap: 18px;
            margin: 18px 0;
            flex-wrap: wrap;
        }
        .ctrl-btn {
            background: #ffbc7a;
            border: none;
            padding: 8px 20px;
            border-radius: 36px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 3px 0 #b46227;
            font-family: inherit;
        }
        .ctrl-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #b46227;
        }
        .word-selector {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }
        .char-btn {
            background: #ffe0b5;
            border: none;
            font-size: 1.8rem;
            padding: 5px 20px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            font-family: monospace;
            transition: 0.1s;
        }
        .char-btn.active {
            background: #ffa559;
            color: white;
            box-shadow: 0 0 0 2px white, 0 0 0 4px #ffa559;
        }

        /* 听写新样式: 听声音选生字 */
        .listen-area {
            text-align: center;
        }
        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }
        .option-card {
            background: #ffefdb;
            border-radius: 48px;
            padding: 20px 10px;
            text-align: center;
            cursor: pointer;
            transition: 0.1s;
            border: 3px solid #ffcf94;
            font-size: 2rem;
            font-weight: bold;
        }
        .option-card:hover {
            background: #ffe2bd;
            transform: scale(0.97);
        }
        .listen-feedback {
            font-size: 1.3rem;
            margin-top: 20px;
            font-weight: bold;
            background: #ffefcf;
            border-radius: 50px;
            padding: 12px;
        }
        /* 配对 */
        .pair-game {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .pair-row {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
        }
        .pair-box {
            background: #fff0de;
            border-radius: 38px;
            padding: 18px 5px;
            text-align: center;
            flex: 1;
            min-width: 110px;
            cursor: pointer;
            border: 3px solid #ffcd94;
            font-weight: bold;
            transition: 0.05s linear;
        }
        .pair-word {
            font-size: 2rem;
        }
        .pair-pinyin {
            font-size: 1.2rem;
            color: #b45f2b;
        }
        .pair-box.selected {
            background: #ffe3aa;
            border: 4px solid #ff9340;
        }
        .pair-box.matched {
            visibility: hidden;
            display: none;
        }
        /* 教师编辑面板 */
        .teacher-panel {
            background: #fff0e0;
            border-radius: 48px;
            padding: 20px;
            margin-top: 20px;
            border: 2px solid #ffb76e;
        }
        .teacher-panel h3 {
            color: #bc631e;
            margin-bottom: 15px;
        }
        .word-list-edit {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            max-height: 200px;
            overflow-y: auto;
            background: #fff6ea;
            padding: 12px;
            border-radius: 32px;
        }
        .edit-word-item {
            background: #ffe2bd;
            padding: 6px 14px;
            border-radius: 50px;
            display: inline-flex;
            gap: 8px;
            align-items: baseline;
        }
        .edit-word-item input {
            width: 70px;
            font-size: 1rem;
            border-radius: 30px;
            border: 1px solid #ffb462;
            text-align: center;
            background: white;
        }
        .edit-controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .save-btn {
            background: #6fbf4c;
            box-shadow: 0 3px 0 #367c1a;
            color: white;
        }
        .password-input {
            margin-bottom: 12px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .teacher-mode-active {
            background: #ffd28f;
            border-left: 8px solid #e67e22;
        }
        footer {
            text-align: center;
            padding: 15px;
            background: #ffefdb;
            font-size: 0.8rem;
            color: #b45f2b;
        }
        @media (max-width: 680px) {
            .page-container { padding: 18px; }
            .big-word { font-size: 3.5rem; }
        }
    </style>
</head>
<body>
<div class="app-wrapper">
    <div class="header">
        <div class="title-area">
            <h1>📖 马来小狮识字乐园 🐯</h1>
            <p>马来西亚二年级华文 · 双模式互动学习</p>
        </div>
        <div class="mode-badge">
            <span class="mode-text" id="modeLabel">👧🏻 学生模式</span>
            <button id="toggleTeacherBtn" class="teacher-btn">🔐 教师入口</button>
        </div>
    </div>

    <!-- 菜单栏 -->
    <div class="menu-nav">
        <button class="menu-btn" data-page="read">🔊 朗读</button>
        <button class="menu-btn" data-page="stroke">✍️ 笔顺</button>
        <button class="menu-btn" data-page="listen">🎧 听音选字</button>
        <button class="menu-btn" data-page="pair">🧩 配对游戏</button>
    </div>

    <div class="page-container">
        <!-- 朗读页面 -->
        <div id="page-read" class="page">
            <div class="card">
                <h2>📣 大声朗读</h2>
                <div class="read-area">
                    <div class="big-word" id="readWordDisplay">朋</div>
                    <button class="audio-btn" id="speakBtn">🔊 播放读音</button>
                    <p style="margin-top: 20px;">⭐ 点击喇叭，跟着小狮一起读～</p>
                </div>
            </div>
        </div>

        <!-- 笔顺页面 严格笔顺 -->
        <div id="page-stroke" class="page">
            <div class="card">
                <h2>✍️ 正确笔顺练习</h2>
                <div class="stroke-container">
                    <div class="word-selector" id="strokeCharSelector"></div>
                    <div class="stroke-canvas-box">
                        <canvas id="strokeCanvas" width="300" height="300" style="width:100%; max-width:300px; aspect-ratio:1/1"></canvas>
                    </div>
                    <div class="stroke-controls">
                        <button class="ctrl-btn" id="clearCanvasBtn">🧽 清空画板</button>
                        <button class="ctrl-btn" id="animateStrokeBtn">✍️ 演示正确笔顺</button>
                    </div>
                    <p style="font-size:0.75rem; text-align:center;">💡 用手指或鼠标按笔顺描写，点击演示观看标准顺序</p>
                </div>
            </div>
        </div>

        <!-- 听写页面 - 听声音选生字 -->
        <div id="page-listen" class="page">
            <div class="card">
                <h2>🎵 听声音 找生字</h2>
                <div class="listen-area">
                    <button class="audio-btn" id="listenPlayBtn" style="margin-bottom: 20px;">🔊 播放神秘生字</button>
                    <div id="listenOptions" class="options-grid"></div>
                    <div id="listenFeedback" class="listen-feedback">✨ 点击喇叭，再点击正确的汉字！</div>
                </div>
            </div>
        </div>

        <!-- 配对页面 -->
        <div id="page-pair" class="page">
            <div class="card">
                <h2>🧩 生字 & 拼音 配对</h2>
                <div id="pairGameContainer" class="pair-game"></div>
                <button class="ctrl-btn" id="resetPairBtn" style="margin-top: 20px; width:100%">🔄 重新配对</button>
                <div id="pairMessage" class="listen-feedback" style="margin-top:15px;">⭐ 点击汉字，再点击对应拼音，配对成功会消失！</div>
            </div>
        </div>

        <!-- 教师编辑面板 (默认隐藏) -->
        <div id="teacherPanel" style="display: none;" class="teacher-panel">
            <h3>👩‍🏫 教师模式 - 编辑生字库</h3>
            <div class="password-input">
                <input type="password" id="teacherPwd" placeholder="输入教师密码" style="padding:8px 16px; border-radius:40px; border:1px solid #ffb462;">
                <button id="unlockEditBtn" class="ctrl-btn">🔓 解锁编辑</button>
                <span id="pwdError" style="color:red; font-size:0.8rem;"></span>
            </div>
            <div id="editArea" style="display: none;">
                <div id="wordEditList" class="word-list-edit"></div>
                <div class="edit-controls">
                    <button id="addWordBtn" class="ctrl-btn">➕ 添加生字</button>
                    <button id="saveWordBankBtn" class="ctrl-btn save-btn">💾 保存修改</button>
                    <button id="exitTeacherMode" class="ctrl-btn">🚪 退出教师模式</button>
                </div>
                <p style="margin-top:12px; font-size:0.8rem;">⚠️ 每个生字需填写汉字和拼音，保存后所有页面立即更新 (笔顺仅支持预设汉字,新增字会使用默认笔顺展示)</p>
            </div>
        </div>
    </div>
    <footer>🐣 依据马来西亚二年级课本 | 教师模式密码: 123456 (演示用) 可随意修改字库</footer>
</div>

<script>
    // ----------------------------- 初始字库 (马来西亚二年级核心) -----------------------------
    let wordBank = [
        { char: "朋", pinyin: "péng" },
        { char: "友", pinyin: "yǒu" },
        { char: "校", pinyin: "xiào" },
        { char: "学", pinyin: "xué" },
        { char: "习", pinyin: "xí" },
        { char: "快", pinyin: "kuài" },
        { char: "乐", pinyin: "lè" },
        { char: "读", pinyin: "dú" },
        { char: "书", pinyin: "shū" }
    ];

    // ----------------------------- 严格笔顺数据库 (每一笔顺序) 每个汉字拥有独立的笔画绘制函数列表 (确保正确笔顺视觉效果)-------------
    // 采用Canvas绘图模拟标准笔顺 (每一笔独立绘制，演示时一笔一笔出现)
    const strokeDB = {
        "朋": [
            (ctx) => { ctx.beginPath(); ctx.moveTo(80,80); ctx.lineTo(110,70); ctx.lineTo(120,130); ctx.lineTo(90,140); ctx.fillStyle="#b45f2b"; ctx.fill(); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(70,100); ctx.lineTo(80,190); ctx.lineTo(110,200); ctx.lineTo(100,110); ctx.fill(); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(170,70); ctx.lineTo(200,65); ctx.lineTo(210,125); ctx.lineTo(180,135); ctx.fill(); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(160,90); ctx.lineTo(170,190); ctx.lineTo(200,195); ctx.lineTo(190,100); ctx.fill(); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(130,155); ctx.lineTo(170,150); ctx.lineWidth=6; ctx.stroke(); }
        ],
        "友": [
            (ctx) => { ctx.beginPath(); ctx.moveTo(120,70); ctx.lineTo(100,130); ctx.lineTo(150,135); ctx.lineTo(170,80); ctx.fill(); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(80,100); ctx.lineTo(180,95); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(120,130); ctx.lineTo(100,200); ctx.lineTo(150,210); ctx.lineTo(160,160); ctx.fill(); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(170,160); ctx.lineTo(200,190); ctx.stroke(); }
        ],
        "校": [
            (ctx) => { ctx.beginPath(); ctx.moveTo(70,70); ctx.lineTo(70,200); ctx.stroke(); }, { ctx.beginPath(); ctx.moveTo(45,120); ctx.lineTo(95,120); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(70,100); ctx.lineTo(55,70); ctx.stroke(); ctx.beginPath(); ctx.moveTo(70,100); ctx.lineTo(85,70); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(130,80); ctx.lineTo(160,75); ctx.lineTo(170,125); ctx.lineTo(140,130); ctx.fill(); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(150,125); ctx.lineTo(140,180); ctx.lineTo(190,185); ctx.lineTo(195,140); ctx.fill(); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(180,100); ctx.lineTo(210,105); ctx.stroke(); }
        ],
        "学": [
            (ctx) => { ctx.beginPath(); ctx.moveTo(100,60); ctx.lineTo(200,60); ctx.stroke(); }, { ctx.beginPath(); ctx.moveTo(150,60); ctx.lineTo(150,100); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(80,100); ctx.lineTo(220,100); ctx.stroke(); }, { ctx.beginPath(); ctx.moveTo(110,130); ctx.lineTo(190,130); ctx.stroke(); ctx.beginPath(); ctx.moveTo(150,130); ctx.lineTo(150,200); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(90,170); ctx.lineTo(210,170); ctx.stroke(); }
        ],
        "习": [
            (ctx) => { ctx.beginPath(); ctx.moveTo(100,70); ctx.lineTo(200,70); ctx.stroke(); }, { ctx.beginPath(); ctx.moveTo(80,100); ctx.lineTo(220,100); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(70,130); ctx.lineTo(230,130); ctx.stroke(); }, { ctx.beginPath(); ctx.ellipse(150,160,40,25,0,0,Math.PI*2); ctx.stroke(); }
        ],
        "快": [
            (ctx) => { ctx.beginPath(); ctx.moveTo(60,80); ctx.lineTo(60,210); ctx.stroke(); }, { ctx.beginPath(); ctx.moveTo(40,120); ctx.lineTo(80,120); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(110,90); ctx.lineTo(140,85); ctx.lineTo(150,130); ctx.lineTo(120,135); ctx.fill(); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(150,110); ctx.lineTo(190,100); ctx.lineTo(210,150); ctx.lineTo(170,160); ctx.fill(); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(190,130); ctx.lineTo(220,180); ctx.stroke(); }
        ],
        "乐": [
            (ctx) => { ctx.beginPath(); ctx.moveTo(150,50); ctx.lineTo(150,220); ctx.stroke(); }, { ctx.beginPath(); ctx.moveTo(80,100); ctx.lineTo(220,100); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(80,150); ctx.lineTo(220,150); ctx.stroke(); }, { ctx.beginPath(); ctx.moveTo(100,180); ctx.lineTo(200,180); ctx.stroke(); }
        ],
        "读": [
            (ctx) => { ctx.beginPath(); ctx.moveTo(70,70); ctx.lineTo(70,210); ctx.stroke(); }, { ctx.beginPath(); ctx.moveTo(50,110); ctx.lineTo(90,110); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(120,80); ctx.lineTo(150,75); ctx.lineTo(160,120); ctx.lineTo(130,125); ctx.fill(); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(150,95); ctx.lineTo(190,90); ctx.lineTo(200,140); ctx.lineTo(170,145); ctx.fill(); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(180,115); ctx.lineTo(210,110); ctx.lineTo(220,160); ctx.stroke(); }, { ctx.beginPath(); ctx.moveTo(95,160); ctx.lineTo(220,160); ctx.stroke(); }
        ],
        "书": [
            (ctx) => { ctx.beginPath(); ctx.moveTo(100,70); ctx.lineTo(200,70); ctx.stroke(); }, { ctx.beginPath(); ctx.moveTo(80,110); ctx.lineTo(220,110); ctx.stroke(); },
            (ctx) => { ctx.beginPath(); ctx.moveTo(150,50); ctx.lineTo(150,180); ctx.stroke(); }, { ctx.beginPath(); ctx.moveTo(110,150); ctx.lineTo(190,150); ctx.stroke(); }
        ]
    };
    // 为所有字保证笔顺存在，若新增未定义则使用默认简单结构
    function getStrokeArray(ch) {
        if(strokeDB[ch]) return strokeDB[ch];
        // 默认一笔横线作为提示
        return [(ctx) => { ctx.beginPath(); ctx.moveTo(50,150); ctx.lineTo(250,150); ctx.stroke(); }];
    }

    // 全局变量
    let currentMode = "student"; // student / teacher
    let teacherAuthenticated = false;
    let strokeAnimInterval = null;
    let currentStrokeChar = "朋";
    let strokeFunctions = [];

    // DOM 元素
    const canvas = document.getElementById('strokeCanvas');
    const ctx = canvas.getContext('2d');
    const readWordSpan = document.getElementById('readWordDisplay');
    const speakBtn = document.getElementById('speakBtn');
    const strokeSelectorDiv = document.getElementById('strokeCharSelector');
    const clearCanvasBtn = document.getElementById('clearCanvasBtn');
    const animateStrokeBtn = document.getElementById('animateStrokeBtn');
    const modeLabel = document.getElementById('modeLabel');
    const toggleTeacherBtn = document.getElementById('toggleTeacherBtn');
    const teacherPanel = document.getElementById('teacherPanel');
    const editArea = document.getElementById('editArea');
    const unlockEditBtn = document.getElementById('unlockEditBtn');
    const teacherPwd = document.getElementById('teacherPwd');
    const pwdErrorSpan = document.getElementById('pwdError');
    const wordEditList = document.getElementById('wordEditList');
    const addWordBtn = document.getElementById('addWordBtn');
    const saveWordBankBtn = document.getElementById('saveWordBankBtn');
    const exitTeacherModeBtn = document.getElementById('exitTeacherMode');

    // 辅助函数: 朗读
    function speakWord(word) {
        const utterance = new SpeechSynthesisUtterance(word);
        utterance.lang = 'zh-CN';
        utterance.rate = 0.7;
        speechSynthesis.cancel();
        speechSynthesis.speak(utterance);
    }

    // 笔顺画板操作
    function clearCanvasDrawing() {
        ctx.clearRect(0, 0, 300, 300);
        ctx.fillStyle = "#fef7e8";
        ctx.fillRect(0, 0, 300, 300);
        ctx.strokeStyle = "#b45f2b";
        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
    }
    function loadStrokeForChar(char) {
        strokeFunctions = getStrokeArray(char);
        clearCanvasDrawing();
        // 全部绘制灰色底图? 为了演示时干净，不清空全绘制; 让学生描写时，演示动画时才重绘完整
    }
    function drawFullStroke() {
        clearCanvasDrawing();
        for(let fn of strokeFunctions) {
            ctx.save();
            fn(ctx);
            ctx.restore();
        }
    }
    function animateStrokeSequence() {
        if(strokeAnimInterval) clearInterval(strokeAnimInterval);
        clearCanvasDrawing();
        let idx = 0;
        function drawNext() {
            if(idx < strokeFunctions.length) {
                strokeFunctions[idx](ctx);
                idx++;
            } else {
                clearInterval(strokeAnimInterval);
                strokeAnimInterval = null;
            }
        }
        strokeAnimInterval = setInterval(drawNext, 550);
    }

    // 刷新笔顺选择器
    function rebuildStrokeSelector() {
        strokeSelectorDiv.innerHTML = '';
        wordBank.forEach(w => {
            const btn = document.createElement('button');
            btn.innerText = w.char;
            btn.classList.add('char-btn');
            if(w.char === currentStrokeChar) btn.classList.add('active');
            btn.addEventListener('click', () => {
                document.querySelectorAll('#strokeCharSelector .char-btn').forEach(b=>b.classList.remove('active'));
                btn.classList.add('active');
                currentStrokeChar = w.char;
                loadStrokeForChar(currentStrokeChar);
                updateReadWord(); // 同步朗读显示
            });
            strokeSelectorDiv.appendChild(btn);
        });
        if(wordBank.findIndex(w=>w.char===currentStrokeChar)===-1 && wordBank.length) currentStrokeChar=wordBank[0].char;
        loadStrokeForChar(currentStrokeChar);
    }

    function updateReadWord() {
        readWordSpan.innerText = currentStrokeChar;
    }

    // 听写新逻辑: 听音选字
    let currentListenWord = null;
    function buildListenGame() {
        const optionsDiv = document.getElementById('listenOptions');
        if(!optionsDiv) return;
        // 随机选一个生字
        const randomIndex = Math.floor(Math.random() * wordBank.length);
        currentListenWord = wordBank[randomIndex];
        // 生成选项 (包含正确+其他不重复)
        let candidates = [currentListenWord];
        const others = wordBank.filter(w => w.char !== currentListenWord.char);
        for(let i=0; i<Math.min(3, others.length); i++) candidates.push(others[i]);
        candidates = candidates.sort(() => Math.random() - 0.5);
        optionsDiv.innerHTML = '';
        candidates.forEach(opt => {
            const btn = document.createElement('div');
            btn.className = 'option-card';
            btn.innerText = opt.char;
            btn.dataset.char = opt.char;
            btn.addEventListener('click', (e) => {
                const selectedChar = btn.dataset.char;
                const feedback = document.getElementById('listenFeedback');
                if(selectedChar === currentListenWord.char) {
                    feedback.innerHTML = '✅ 哇！ 答对啦！ 好厉害！ 🎉🎉🎉';
                    setTimeout(()=> buildListenGame(), 1200);
                } else {
                    feedback.innerHTML = `❌ 不对哦～ 再听一次读音吧！ 正确字是“${currentListenWord.char}”吗？ 再试试看！`;
                }
            });
            optionsDiv.appendChild(btn);
        });
        document.getElementById('listenFeedback').innerHTML = '🔊 点击上方的喇叭，再选出正确的汉字！';
    }
    document.getElementById('listenPlayBtn')?.addEventListener('click', () => {
        if(currentListenWord) speakWord(currentListenWord.char);
        else buildListenGame();
    });

    // 配对游戏刷新
    let selectedPair = null; let selectedDomPair = null;
    function buildPairGame() {
        const container = document.getElementById('pairGameContainer');
        container.innerHTML = '';
        const shuffled = [...wordBank];
        for(let i=shuffled.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];}
        const charRow = document.createElement('div'); charRow.className = 'pair-row';
        const pinyinRow = document.createElement('div'); pinyinRow.className = 'pair-row';
        shuffled.forEach(item => {
            const charBox = document.createElement('div'); charBox.className = 'pair-box'; charBox.dataset.type = 'char'; charBox.dataset.value = item.char; charBox.dataset.matchPinyin = item.pinyin;
            charBox.innerHTML = `<div class="pair-word">${item.char}</div><div class="pair-pinyin">✨ 汉字</div>`;
            charRow.appendChild(charBox);
            const pinyinBox = document.createElement('div'); pinyinBox.className = 'pair-box'; pinyinBox.dataset.type = 'pinyin'; pinyinBox.dataset.value = item.pinyin; pinyinBox.dataset.matchChar = item.char;
            pinyinBox.innerHTML = `<div class="pair-word">${item.pinyin}</div><div class="pair-pinyin">🔊 拼音</div>`;
            pinyinRow.appendChild(pinyinBox);
        });
        container.appendChild(charRow); container.appendChild(pinyinRow);
        attachPairEvents();
    }
    function attachPairEvents() {
        document.querySelectorAll('.pair-box').forEach(box => {
            box.removeEventListener('click', pairHandler);
            box.addEventListener('click', pairHandler);
        });
    }
    function pairHandler(e) {
        const box = e.currentTarget;
        if(box.classList.contains('matched')) return;
        if(selectedPair === null) {
            if(selectedDomPair) selectedDomPair.classList.remove('selected');
            selectedPair = box;
            selectedDomPair = box;
            box.classList.add('selected');
        } else {
            const first = selectedPair, second = box;
            let match = false;
            if(first.dataset.type === 'char' && second.dataset.type === 'pinyin' && first.dataset.matchPinyin === second.dataset.value) match=true;
            if(first.dataset.type === 'pinyin' && second.dataset.type === 'char' && first.dataset.matchChar === second.dataset.value) match=true;
            if(match) {
                first.classList.add('matched'); second.classList.add('matched');
                first.style.display='none'; second.style.display='none';
                document.getElementById('pairMessage').innerHTML = '🎉 配对成功！ 真聪明！';
            } else {
                document.getElementById('pairMessage').innerHTML = '😢 配对错误，再试试！ 汉字配对应拼音。';
            }
            selectedPair.classList.remove('selected');
            selectedPair = null; selectedDomPair = null;
        }
    }
    document.getElementById('resetPairBtn')?.addEventListener('click', ()=>{ buildPairGame(); document.getElementById('pairMessage').innerHTML='⭐ 重新开始配对啦！'; selectedPair=null; });

    // 教师模式编辑界面构建
    function refreshEditList() {
        wordEditList.innerHTML = '';
        wordBank.forEach((item, idx) => {
            const div = document.createElement('div'); div.className = 'edit-word-item';
            div.innerHTML = `<input type="text" class="edit-char" value="${item.char}" style="width:70px;"> 
                             <input type="text" class="edit-pinyin" value="${item.pinyin}" style="width:100px;">
                             <button class="ctrl-btn del-word" data-idx="${idx}" style="background:#ff8c5a;">🗑️</button>`;
            wordEditList.appendChild(div);
        });
        document.querySelectorAll('.del-word').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const idx = parseInt(btn.dataset.idx);
                if(!isNaN(idx)) wordBank.splice(idx,1);
                refreshEditList();
            });
        });
    }
    addWordBtn.addEventListener('click', () => { wordBank.push({ char: "新", pinyin: "xīn" }); refreshEditList(); });
    saveWordBankBtn.addEventListener('click', () => {
        const newBank = [];
        const items = document.querySelectorAll('.edit-word-item');
        for(let item of items) {
            const charInput = item.querySelector('.edit-char');
            const pinyinInput = item.querySelector('.edit-pinyin');
            if(charInput && pinyinInput && charInput.value.trim() !== "") {
                newBank.push({ char: charInput.value.trim(), pinyin: pinyinInput.value.trim() });
            }
        }
        if(newBank.length>0) wordBank = newBank;
        // 刷新所有组件
        rebuildStrokeSelector();
        buildListenGame();
        buildPairGame();
        updateReadWord();
        if(wordBank.length) currentStrokeChar = wordBank[0].char;
        loadStrokeForChar(currentStrokeChar);
        document.getElementById('pairMessage').innerHTML = '✅ 字库已更新！';
    });
    function enterTeacherMode() {
        currentMode = "teacher";
        modeLabel.innerText = "👩‍🏫 教师模式";
        teacherPanel.style.display = "block";
        refreshEditList();
    }
    function exitTeacherMode() {
        currentMode = "student";
        modeLabel.innerText = "👧🏻 学生模式";
        teacherPanel.style.display = "none";
        editArea.style.display = "none";
        teacherAuthenticated = false;
        teacherPwd.value = "";
    }
    toggleTeacherBtn.addEventListener('click', () => {
        if(currentMode === "student") {
            teacherPanel.style.display = "block";
            editArea.style.display = "none";
            pwdErrorSpan.innerText = "";
        } else {
            exitTeacherMode();
        }
    });
    unlockEditBtn.addEventListener('click', () => {
        if(teacherPwd.value === "123456") {
            teacherAuthenticated = true;
            editArea.style.display = "block";
            pwdErrorSpan.innerText = "";
            refreshEditList();
        } else { pwdErrorSpan.innerText = "密码错误，教师密码: 123456"; }
    });
    exitTeacherModeBtn.addEventListener('click', exitTeacherMode);
    // 页面切换
    const pages = { read: 'page-read', stroke: 'page-stroke', listen: 'page-listen', pair: 'page-pair' };
    function switchPage(pageId) {
        Object.values(pages).forEach(pid => document.getElementById(pid).classList.remove('active-page'));
        document.getElementById(pages[pageId]).classList.add('active-page');
        document.querySelectorAll('.menu-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelector(`.menu-btn[data-page="${pageId}"]`).classList.add('active');
        if(pageId === 'listen') buildListenGame();
        if(pageId === 'pair') buildPairGame();
        if(pageId === 'stroke') { loadStrokeForChar(currentStrokeChar); }
    }
    document.querySelectorAll('.menu-btn').forEach(btn => {
        btn.addEventListener('click', () => switchPage(btn.dataset.page));
    });
    speakBtn.addEventListener('click', () => speakWord(currentStrokeChar));
    clearCanvasBtn.addEventListener('click', () => { if(strokeAnimInterval)clearInterval(strokeAnimInterval); clearCanvasDrawing(); });
    animateStrokeBtn.addEventListener('click', () => { if(strokeAnimInterval)clearInterval(strokeAnimInterval); animateStrokeSequence(); });
    // 初始化
    rebuildStrokeSelector();
    buildListenGame();
    buildPairGame();
    switchPage('read');
    updateReadWord();
</script>
</body>
</html>
